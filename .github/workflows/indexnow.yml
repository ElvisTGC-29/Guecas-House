name: Notificar buscadores

on:
  push:
    branches: [main]
    paths:
      - index.html
      - fanfics.html
      - paginas-detalhes/detalhes-alvo-dumbledore-e-as-memorias-ancestrais.html
      - css/15-fanfic-alvo.css
      - arquivos/Imagens/alvo-dumbledore-e-as-memorias-ancestrais-400.webp
      - arquivos/Imagens/alvo-dumbledore-e-as-memorias-ancestrais-800.webp
      - sitemap.xml
      - f6c91d2a8b374e50a1d7c4e29f83b605.txt
      - .github/workflows/indexnow.yml

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar a publicação do GitHub Pages
        run: sleep 60
      - name: Enviar páginas atualizadas ao IndexNow
        env:
          INDEXNOW_KEY: f6c91d2a8b374e50a1d7c4e29f83b605
        run: |
          payload=$(jq -nc \
            --arg host "www.guecashouse.com.br" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://www.guecashouse.com.br/$INDEXNOW_KEY.txt" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:["https://www.guecashouse.com.br/","https://www.guecashouse.com.br/fanfics.html","https://www.guecashouse.com.br/paginas-detalhes/detalhes-alvo-dumbledore-e-as-memorias-ancestrais.html"]}')

          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --show-error --output indexnow-response.txt --write-out "%{http_code}" \
              --request POST "https://api.indexnow.org/indexnow" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data "$payload")

            if [ "$status" = "200" ] || [ "$status" = "202" ]; then
              exit 0
            fi

            sleep 30
          done

          cat indexnow-response.txt
          exit 1
